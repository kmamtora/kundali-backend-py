apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-api.fullname" . }}
  labels:
    {{- include "enterprise-api.labels" . | nindent 4 }}
    component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "enterprise-api.selectorLabels" . | nindent 4 }}
    component: api
  sessionAffinity: None
