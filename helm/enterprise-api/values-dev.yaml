# Development environment values
global:
  environment: development

image:
  tag: "dev"

api:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

beat:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  hosts:
    - host: api-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: enterprise-api-dev-tls
      hosts:
        - api-dev.example.com

config:
  debug: true
  environment: "development"
  database:
    echo: true
  logging:
    level: "DEBUG"
  otel:
    tracesSamplerArg: 0.1
  docs:
    enabled: true

podDisruptionBudget:
  enabled: false
