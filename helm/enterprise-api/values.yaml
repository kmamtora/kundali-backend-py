# Default values for enterprise-api
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: production

# Image configuration
image:
  repository: enterprise-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# API deployment configuration
api:
  enabled: true
  replicaCount: 2
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Celery worker configuration
worker:
  enabled: true
  replicaCount: 2
  concurrency: 4
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Celery beat configuration
beat:
  enabled: true
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: enterprise-api-tls
      hosts:
        - api.example.com

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  api:
    minAvailable: 1
  worker:
    minAvailable: 1

# Application configuration
config:
  # Application Settings
  appName: "Enterprise FastAPI"
  appVersion: "1.0.0"
  debug: false
  environment: "production"
  apiV1Prefix: "/api/v1"
  
  # Database Settings
  database:
    poolSize: 20
    maxOverflow: 10
    poolTimeout: 30
    poolRecycle: 3600
    echo: false
  
  # Redis Settings
  redis:
    poolSize: 10
    cacheTTL: 3600
    sessionTTL: 86400
  
  # JWT Settings
  jwt:
    algorithm: "HS256"
    accessTokenExpireMinutes: 30
    refreshTokenExpireDays: 7
    tokenUrl: "/api/v1/auth/login"
    bcryptCostFactor: 12
  
  # CORS Settings
  cors:
    origins: '["*"]'
    allowCredentials: true
    allowMethods: '["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]'
    allowHeaders: '["*"]'
    maxAge: 600
  
  # Rate Limiting Settings
  rateLimit:
    enabled: true
    perMinute: 60
    perHour: 1000
  
  # Celery Settings
  celery:
    taskSerializer: "json"
    resultSerializer: "json"
    acceptContent: '["json"]'
    timezone: "UTC"
    taskTimeLimit: 1800
    taskSoftTimeLimit: 1500
  
  # OpenTelemetry Settings
  otel:
    enabled: true
    serviceName: "enterprise-api"
    exporterEndpoint: "http://otel-collector:4317"
    exporterInsecure: true
    tracesSampler: "always_on"
    tracesSamplerArg: 1.0
  
  # Logging Settings
  logging:
    level: "INFO"
    format: "json"
  
  # Metrics Settings
  metrics:
    enabled: true
    endpoint: "/metrics"
  
  # Health Check Settings
  healthCheck:
    enabled: true
    pathLive: "/health/live"
    pathReady: "/health/ready"
  
  # API Documentation Settings
  docs:
    enabled: true
    docsUrl: "/docs"
    redocUrl: "/redoc"
    openapiUrl: "/openapi.json"
  
  # Security Settings
  security:
    allowedHosts: '["*"]'
    trustedProxies: "[]"
    sanitizeInputs: true
    maxRequestSize: 10485760
  
  # Pagination Settings
  pagination:
    defaultPageSize: 20
    maxPageSize: 100

# Secrets configuration
secrets:
  # Database URL - MUST be set
  databaseUrl: "postgresql+asyncpg://postgres:CHANGE_ME@postgres:5432/enterprise_api"
  
  # Redis URL
  redisUrl: "redis://redis:6379/0"
  
  # JWT Secret Key - MUST be changed
  secretKey: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY_AT_LEAST_32_CHARS"
  
  # Celery URLs
  celeryBrokerUrl: "redis://redis:6379/0"
  celeryResultBackend: "redis://redis:6379/0"
  
  # Rate Limit Storage
  rateLimitStorageUrl: "redis://redis:6379/0"
  
  # Use existing secret instead of creating new one
  existingSecret: ""

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 5432  # PostgreSQL
      - protocol: TCP
        port: 6379  # Redis
