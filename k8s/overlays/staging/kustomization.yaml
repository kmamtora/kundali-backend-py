apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: enterprise-api-staging

namespace: staging

bases:
- ../../base

namePrefix: staging-

commonLabels:
  environment: staging

images:
- name: enterprise-api
  newName: enterprise-api
  newTag: staging

replicas:
- name: enterprise-api
  count: 2
- name: enterprise-api-worker
  count: 2

patches:
- patch: |-
    - op: replace
      path: /data/ENVIRONMENT
      value: "staging"
    - op: replace
      path: /data/DEBUG
      value: "false"
    - op: replace
      path: /data/LOG_LEVEL
      value: "INFO"
    - op: replace
      path: /data/DOCS_ENABLED
      value: "true"
    - op: replace
      path: /data/OTEL_TRACES_SAMPLER_ARG
      value: "0.5"
    - op: replace
      path: /data/RATE_LIMIT_PER_MINUTE
      value: "100"
  target:
    kind: ConfigMap
    name: enterprise-api-config

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "1000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"
  target:
    kind: Deployment
    name: enterprise-api

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "1000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "1Gi"
  target:
    kind: Deployment
    name: enterprise-api-worker
