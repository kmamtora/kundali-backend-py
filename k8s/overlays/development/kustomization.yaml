apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: enterprise-api-development

namespace: development

bases:
- ../../base

namePrefix: dev-

commonLabels:
  environment: development

images:
- name: enterprise-api
  newName: enterprise-api
  newTag: dev

replicas:
- name: enterprise-api
  count: 1
- name: enterprise-api-worker
  count: 1

patches:
- patch: |-
    - op: replace
      path: /data/ENVIRONMENT
      value: "development"
    - op: replace
      path: /data/DEBUG
      value: "true"
    - op: replace
      path: /data/LOG_LEVEL
      value: "DEBUG"
    - op: replace
      path: /data/DOCS_ENABLED
      value: "true"
    - op: replace
      path: /data/DB_ECHO
      value: "true"
    - op: replace
      path: /data/OTEL_TRACES_SAMPLER_ARG
      value: "0.1"
  target:
    kind: ConfigMap
    name: enterprise-api-config

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "100m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "512Mi"
  target:
    kind: Deployment
    name: enterprise-api

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "100m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "512Mi"
  target:
    kind: Deployment
    name: enterprise-api-worker
