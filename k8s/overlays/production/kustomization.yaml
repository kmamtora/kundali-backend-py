apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: enterprise-api-production

namespace: production

bases:
- ../../base

namePrefix: prod-

commonLabels:
  environment: production

images:
- name: enterprise-api
  newName: enterprise-api
  newTag: v1.0.0

replicas:
- name: enterprise-api
  count: 3
- name: enterprise-api-worker
  count: 3

patches:
- patch: |-
    - op: replace
      path: /data/ENVIRONMENT
      value: "production"
    - op: replace
      path: /data/DEBUG
      value: "false"
    - op: replace
      path: /data/LOG_LEVEL
      value: "WARNING"
    - op: replace
      path: /data/DOCS_ENABLED
      value: "false"
    - op: replace
      path: /data/OTEL_TRACES_SAMPLER_ARG
      value: "1.0"
    - op: replace
      path: /data/RATE_LIMIT_PER_MINUTE
      value: "120"
    - op: replace
      path: /data/RATE_LIMIT_PER_HOUR
      value: "5000"
    - op: replace
      path: /data/DB_POOL_SIZE
      value: "30"
    - op: replace
      path: /data/DB_MAX_OVERFLOW
      value: "20"
  target:
    kind: ConfigMap
    name: enterprise-api-config

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "500m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "1Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "2000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "2Gi"
  target:
    kind: Deployment
    name: enterprise-api

- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "500m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "1Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "2000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "2Gi"
  target:
    kind: Deployment
    name: enterprise-api-worker

- patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 2
  target:
    kind: PodDisruptionBudget
    name: enterprise-api

- patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 2
  target:
    kind: PodDisruptionBudget
    name: enterprise-api-worker
