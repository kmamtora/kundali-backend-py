apiVersion: v1
kind: Secret
metadata:
  name: enterprise-api-secrets
  labels:
    app: enterprise-api
type: Opaque
stringData:
  # Database URL - MUST be updated with actual credentials
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME@postgres:5432/enterprise_api"
  
  # Redis URL - MUST be updated with actual credentials if Redis has auth
  REDIS_URL: "redis://redis:6379/0"
  
  # JWT Secret Key - MUST be changed to a strong random value
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY_AT_LEAST_32_CHARS"
  
  # Celery URLs (defaults to Redis if not set)
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  
  # Rate Limit Storage (defaults to Redis if not set)
  RATE_LIMIT_STORAGE_URL: "redis://redis:6379/0"
