apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api
  labels:
    app: enterprise-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-api
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: enterprise-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: enterprise-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: enterprise-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: enterprise-api-config
        - secretRef:
            name: enterprise-api-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api-worker
  labels:
    app: enterprise-api
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-api
      component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: enterprise-api
        component: worker
    spec:
      serviceAccountName: enterprise-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: worker
        image: enterprise-api:latest
        imagePullPolicy: IfNotPresent
        command: ["celery"]
        args:
        - "-A"
        - "app.tasks.celery_app"
        - "worker"
        - "--loglevel=info"
        - "--concurrency=4"
        envFrom:
        - configMapRef:
            name: enterprise-api-config
        - secretRef:
            name: enterprise-api-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api-beat
  labels:
    app: enterprise-api
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-api
      component: beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: enterprise-api
        component: beat
    spec:
      serviceAccountName: enterprise-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: beat
        image: enterprise-api:latest
        imagePullPolicy: IfNotPresent
        command: ["celery"]
        args:
        - "-A"
        - "app.tasks.celery_app"
        - "beat"
        - "--loglevel=info"
        envFrom:
        - configMapRef:
            name: enterprise-api-config
        - secretRef:
            name: enterprise-api-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      terminationGracePeriodSeconds: 30
