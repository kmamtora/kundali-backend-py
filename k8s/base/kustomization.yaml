apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: enterprise-api-base

namespace: default

commonLabels:
  app.kubernetes.io/name: enterprise-api
  app.kubernetes.io/managed-by: kustomize

resources:
- serviceaccount.yaml
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
- poddisruptionbudget.yaml

images:
- name: enterprise-api
  newName: enterprise-api
  newTag: latest
